stages:
  - linters

flutter_linters:
  stage: linters
  image: ghcr.io/cirruslabs/flutter:latest
  script:
    - cd dillearning
    - flutter pub get
    - flutter analyze
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

backend_linters:
  stage: linters
  image: python:3.12
  before_script:
    - pip install tox
  script:
    - tox
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
