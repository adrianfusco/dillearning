stages:
  - linters
  - build

cache:
  paths:
    - $CI_PROJECT_DIR/.pub-cache/

flutter_linters:
  stage: linters
  image: ghcr.io/cirruslabs/flutter:latest
  script:
    - cd dillearning
    - flutter pub get
    - flutter analyze
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

backend_linters:
  stage: linters
  image: python:3.12
  before_script:
    - pip install tox
  script:
    - tox
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build_deb:
  stage: build
  image: ghcr.io/cirruslabs/flutter:latest
  script:
    - scripts/create_frontend_deb_package.sh
  artifacts:
    paths:
      - dillearning/build/linux/x64/release/bundle/*.deb
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

build_apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:latest
  script:
    - cd dillearning
    - flutter pub get
    - flutter build apk --release
  artifacts:
    paths:
      - dillearning/build/app/outputs/flutter-apk/*.apk
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

build_web:
  stage: build
  image: ghcr.io/cirruslabs/flutter:latest
  script:
    - cd dillearning
    - flutter pub get
    - flutter build web
  artifacts:
    paths:
      - dillearning/build/web
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
