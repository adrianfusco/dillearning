services:
  ollama:
    image: ollama/ollama:latest
    entrypoint:
      - /bin/bash
      - -c
      - ollama serve & sleep 5 && ollama pull granite3.3:2b && wait
    environment:
      - OLLAMA_KEEP_ALIVE="24h"
    volumes:
      - ollama-storage:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app:rw
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: unless-stopped

volumes:
  ollama-storage:
