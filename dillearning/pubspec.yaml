name: dillearning
description: "dillearning (dil del Turco idioma o lengua) - Aplicación para aprendizaje de idiomas"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3
  bcrypt: ^1.1.3
  http: ^1.2.1
  provider: ^6.1.5+1
  flutter_chat_ui: ^2.9.1
  flutter_chat_core: ^2.8.0
  uuid: ^4.4.0
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/dillearning_logo_1280.png
