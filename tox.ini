[vars]
MODULE_FOLDER = dillearning-backend 

[tox]
envlist = flake,
          isort,
          black,

skipsdist = true

[testenv]
basepython = 3.12

# https://pypi.org/project/flake8/
[testenv:flake]
deps = flake8
commands = flake8 {[vars]MODULE_FOLDER}

# https://pypi.org/project/isort/
[testenv:isort]
deps = isort
commands = isort .

# https://pypi.org/project/black/
[testenv:black]
deps = black
commands = black .

[testenv:dev]
deps = -r dillearning-backend/requirements.txt
commands = uvicorn main:app --app-dir dillearning-backend --host 0.0.0.0 --port 8000 --reload
setenv =
    ENVIRONMENT = dev

[flake8]
max-line-length = 88
exclude = venv,.tox,.git,build,dist
